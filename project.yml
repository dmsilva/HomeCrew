name: HomeCrew

options:
  bundleIdPrefix: com.dmsilva
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-PT
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  HomeCrew:
    type: application
    platform: iOS
    sources:
      - HomeCrew
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmsilva.homecrew
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HomeCrew
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Merged with the generated Info.plist: keys that have no INFOPLIST_KEY_ setting.
        INFOPLIST_FILE: HomeCrew/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HomeCrew/Resources/HomeCrew.entitlements

  HomeCrewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HomeCrewTests
    dependencies:
      - target: HomeCrew
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dmsilva.homecrew.tests

  HomeCrewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HomeCrewUITests
    dependencies:
      - target: HomeCrew
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dmsilva.homecrew.uitests
        TEST_TARGET_NAME: HomeCrew

schemes:
  HomeCrew:
    build:
      targets:
        HomeCrew: all
    test:
      targets:
        - HomeCrewTests
        - HomeCrewUITests
