name: Vendor fonts

# One-off: copies the design's fonts (SIL Open Font License) from google/fonts into the app,
# because the cloud environment that writes the code cannot download them itself.
on:
  push:
    branches: [chore/vendor-fonts]

jobs:
  fonts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Syne and Figtree
        run: |
          set -e
          mkdir -p HomeCrew/Resources/Fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o "HomeCrew/Resources/Fonts/Syne.ttf" "$base/syne/Syne%5Bwght%5D.ttf"
          curl -fsSL -o "HomeCrew/Resources/Fonts/Figtree.ttf" "$base/figtree/Figtree%5Bwght%5D.ttf"
          curl -fsSL -o "HomeCrew/Resources/Fonts/Syne-OFL.txt" "$base/syne/OFL.txt"
          curl -fsSL -o "HomeCrew/Resources/Fonts/Figtree-OFL.txt" "$base/figtree/OFL.txt"
          ls -la HomeCrew/Resources/Fonts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/vendor-fonts.yml
          git add HomeCrew/Resources/Fonts
          git commit -q -m "Add the Syne and Figtree fonts (SIL Open Font License)"
          git push -q origin HEAD:chore/vendor-fonts
